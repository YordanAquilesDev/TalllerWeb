<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión — Granja Pollón</title>
    <meta name="description" content="Acceda al portal mayorista de Granja Pollón: pizarra de precios del día y gestión de pedidos en línea.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="Login.css" rel="stylesheet" type="text/css"/>
    <script src="Login.js" defer></script>
<base target="_blank">
</head>
<body class="login-body">

    <!-- Navegación superior para volver -->
    <header class="login-header">
        <a href="../../index.html" class="btn-volver">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Volver al inicio
        </a>
    </header>

    <main class="login-container">
        <section class="login-card" id="login-card">

            <div class="brand-info">
                <span class="logo-mark" aria-hidden="true">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#F5B301" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c-2 3-5 4-5 8a5 5 0 0 0 10 0c0-4-3-5-5-8z"/></svg>
                </span>
                <div class="logo">Granja <strong>Pollón</strong></div>
                <h2>Portal de clientes mayoristas</h2>
                <p>Ingrese sus credenciales para acceder a la pizarra de precios y la gestión de pedidos.</p>
            </div>

            <!-- Alerta para mensajes de error/éxito dinámicos -->
            <div class="login-alert" id="login-alert" role="alert" aria-live="polite"></div>

            <form class="login-form" id="login-form" novalidate>

                <div class="input-group">
                    <label for="correo">Correo electrónico o RUC</label>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg>
                        <input type="text" id="correo" name="correo" placeholder="ejemplo@negocio.com" autocomplete="username" required>
                    </div>
                    <span class="field-error" id="correo-error"></span>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot-link" id="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-wrapper">
                        <svg class="input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
                        <input type="password" id="password" name="password" class="has-toggle" placeholder="••••••••" autocomplete="current-password" required>
                        <button type="button" class="btn-toggle-pw" id="toggle-pw" aria-label="Mostrar contraseña" aria-pressed="false">
                            <svg class="icon-eye" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg class="icon-eye-off" width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                        </button>
                    </div>
                    <span class="field-error" id="password-error"></span>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="recordar" name="recordar">
                        <span class="checkmark" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                        </span>
                        Recordar mi cuenta
                    </label>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span class="btn-text">Iniciar sesión</span>
                    <span class="btn-spinner" hidden></span>
                </button>
            </form>

            <div class="login-footer">
                <p>¿Aún no tienes una cuenta mayorista? <a href="../Afiliacion/Afiliacion.html">Solicita tu afiliación aquí</a></p>
            </div>

        </section>
    </main>

</body>
</html>
