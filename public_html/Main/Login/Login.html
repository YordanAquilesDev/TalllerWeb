<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Granja Pollón - Iniciar Sesión</title>
    <link href="Login.css" rel="stylesheet" type="text/css"/>
    <script src="Login.js" defer></script>
</head>
<body class="login-body">

    <!-- Navegación superior para volver -->
    <header class="login-header">
        <a href="../../index.html" class="btn-volver">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <line x1="19" y1="12" x2="5" y2="12"></line>
                <polyline points="12 19 5 12 12 5"></polyline>
            </svg>
            Volver al Inicio
        </a>
    </header>

    <main class="login-container">
        <section class="login-card">
            
            <div class="brand-info">
                <div class="logo"><span>Granja</span> <strong>Pollón</strong></div>
                <h2>Portal de Clientes Mayoristas</h2>
                <p>Ingrese sus credenciales para acceder a la pizarra de precios y gestión de pedidos.</p>
            </div>

            <!-- Alerta para mensajes de error/éxito dinámicos -->
            <div class="login-alert" id="login-alert" aria-live="polite"></div>

            <form class="login-form" id="login-form">
                
                <div class="input-group">
                    <label for="correo">Correo Electrónico / RUC</label>
                    <div class="input-wrapper">
                        <input type="email" id="correo" name="correo" placeholder="ejemplo@negocio.com" required autocomplete="username">
                    </div>
                </div>

                <div class="input-group">
                    <div class="label-row">
                        <label for="password">Contraseña</label>
                        <a href="#" class="forgot-link">¿Olvidaste tu contraseña?</a>
                    </div>
                    <div class="input-wrapper">
                        <input type="password" id="password" name="password" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" class="btn-toggle-pw" id="toggle-pw" aria-label="Mostrar u ocultar contraseña">
                            👁️
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-container">
                        <input type="checkbox" id="recordar" name="recordar">
                        <span class="checkmark"></span>
                        Recordar mi cuenta
                    </label>
                </div>

                <button type="submit" class="btn-login" id="btn-login">
                    <span class="btn-text">Iniciar Sesión</span>
                    <a href="../Negocio/Home/Home.html">Iniciar Sesión</a>
                    <span class="btn-spinner" hidden></span>
                </button>
            </form>

            <div class="login-footer">
                <p>¿Aún no tienes una cuenta mayorista? <a href="../Afiliacion/afiliacion.html">Solicita tu afiliación aquí</a></p>
            </div>

        </section>
    </main>

</body>
</html>
