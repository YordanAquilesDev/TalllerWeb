<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portal mayorista — Granja Pollón</title>
    <meta name="description" content="Pizarra de precios y lotes disponibles para clientes mayoristas Granja Pollón.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="Home.css" rel="stylesheet" type="text/css">
    <script src="Home.js" type="module" defer></script>
    
</head>
<body class="dashboard-body">

    <!-- ================= HEADER PRIVADO (Dinámico) ================= -->
    <div id="header-container"></div>

    <!-- ================= CONTENIDO PRINCIPAL ================= -->
    <main class="container main-content">

        <!-- KPIs DEL CLIENTE -->
        <section id="kpis-container" class="stagger"></section>

        <!-- CABECERA DE LA PIZARRA Y FILTROS -->
        <section id="pizarra-header-container" class="reveal"></section>

        <!-- GRILLA DE LOTES Y ESTADO VACÍO -->
        <section id="pizarra-grid-container" class="ofertas-section stagger"></section>

    </main>

    <!-- ================= PIE DE PÁGINA (Dinámico) ================= -->
    <div id="footer-container"></div>

    <!-- ================= MODAL CERRAR SESIÓN ================= -->
    <div id="modal-container"></div>

</body>
</html>
