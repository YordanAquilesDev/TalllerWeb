<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Mi Perfil - Granja Pollón</title>
        <link href="Perfil.css" rel="stylesheet" type="text/css"/>
        <script src="Perfil.js" defer></script>
    </head>
    <body class="dashboard-body">

        <!-- HEADER -->
        <header class="header">
            <div class="wrap header-content">
                <a href="Home.html" class="logo">Granja <strong>Pollón</strong> <span>B2B</span></a>

                <nav class="nav" id="nav-dashboard">
                    <a href="Home.html" >Hacer Pedido</a>
                    <a href="../Historial/Historial.html">Historial</a>
                    <a href="../Perfil/Perfil.html" class="active">Mi Perfil</a>             
                    <a href="../Contacto/Contactos.html">SOPORTE</a>
                </nav>

                <div class="user-box">
                    <span class="user-avatar">DA</span>
                    <div class="user-info">
                        <strong class="user-name">Distribuidora Avícola Lima</strong>
                        <small class="user-role">RUC: 20601234567</small>
                    </div>

                    <button class="btn-salir" id="btn-logout"  title="Salir">✕</button>
                </div>
            </div>
        </header>


        <!-- CONTENIDO PERFIL -->
        <main class="container profile-container">
            <!-- Sidebar de usuario -->
            <aside class="profile-sidebar">
                <div class="profile-avatar-box">
                    <div class="avatar-placeholder">DAL</div>
                    <h3>Distribuidora Avícola Lima</h3>
                    <span class="user-badge">Cliente Mayorista Plus</span>
                </div>
                <nav class="profile-menu">
                    <a href="#datos" class="menu-item active">Datos Empresa / Personales</a>

            </aside>

            <!-- Formularios y Secciones -->
            <section class="profile-content">

                <!-- DATOS GENERALES -->
                <div class="card-section" id="datos">
                    <h2>Información de la Cuenta</h2>
                    <form id="form-datos">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="razon-social">Razón Social / Nombre Completo</label>
                                <input type="text" id="razon-social" value="Distribuidora Avícola Lima S.A.C.">
                            </div>
                            <div class="form-group">
                                <label for="ruc">RUC / DNI</label>
                                <input type="text" id="ruc" value="20601234567" readonly disabled>
                            </div>
                            <div class="form-group">
                                <label for="correo">Correo Electrónico</label>
                                <input type="email" id="correo" value="ventas@avicolalima.pe">
                            </div>
                            <div class="form-group">
                                <label for="telefono">Teléfono / WhatsApp de Pedidos</label>
                                <input type="tel" id="telefono" value="+51 987 654 321">
                            </div>
                        </div>

                        <!-- DIRECCIONES DE ENTREGA -->
                        <div class="card-section" id="direcciones">
                            <h2>Puntos de Despacho (Descarga)</h2>
                            <div class="address-list">
                                <div class="address-item" style="display: flex; flex-direction: column; gap: 10px;">
                                    <div class="form-group" style="width: 100%;">
                                        <label for="dir-principal">Nombre del Local / Referencia</label>
                                        <input type="text" id="dir-principal" value="Camal Municipal Santa Anita - Stand 14">
                                    </div>
                                    <div class="form-group" style="width: 100%;">
                                        <label for="dir-texto">Dirección Exacta</label>
                                        <input type="text" id="dir-texto" value="Av. Rosa Toro 123, Santa Anita, Lima">
                                    </div>
                                    <span class="tag-primary" style="align-self: flex-start;">Principal</span>
                                </div>
                            </div>
                        </div>
                        <button type="submit" class="btn-guardar">Guardar Cambios</button>
                    </form>
                </div>

            </section>
        </main>

    </body>
</html>
